# nginx reverse proxy for the CDMSTAT gateway (HTTPS only).
# The gateway (uvicorn, port 8080) and the R engine (plumber, port 8000)
# listen on 127.0.0.1 only; nginx is the only thing exposed to the network.

server {
    listen 80;
    server_name cdmstat.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cdmstat.example.org;

    ssl_certificate     /etc/letsencrypt/live/cdmstat.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdmstat.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://$host" always;

    client_max_body_size 20m;

    # Keys travel in the Authorization header and the WebSocket query string;
    # keep them out of the access log.
    log_format cdmstat '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/cdmstat.access.log cdmstat;

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
