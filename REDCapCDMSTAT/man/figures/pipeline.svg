<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">REDCap CDMSTAT pipeline</title>
  <desc id="d">Data flows from REDCap, REDCap Cloud or ODM into the CDMSTAT engine, through data management and statistics, out to reports and CDISC exports, with queries and locks flowing back to REDCap.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#323436"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A01621"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <!-- Write-back loop, over the top -->
  <path d="M815,108 C815,48 200,48 200,108" stroke="#A01621" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <text x="508" y="34" text-anchor="middle" font-size="14" fill="#A01621"><tspan font-weight="700">Back to REDCap</tspan> (External Module): queries in the Data Resolution Workflow, form locks, SDV verification, arm</text>
  <g transform="translate(0,58)">

  <!-- Sources -->
  <text x="20" y="34" font-size="15" font-weight="700" fill="#323436">1  SOURCES</text>
  <g font-size="14" fill="#323436">
    <rect x="20" y="50" width="200" height="62" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="34" y="76" font-weight="700">REDCap</text><text x="34" y="96" fill="#5f6b76">API, log, Data Entry Trigger</text>
    <rect x="20" y="124" width="200" height="62" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="34" y="150" font-weight="700">REDCap Cloud</text><text x="34" y="170" fill="#5f6b76">REST API, CDISC ODM</text>
    <rect x="20" y="198" width="200" height="62" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="34" y="224" font-weight="700">Any EDC</text><text x="34" y="244" fill="#5f6b76">CDISC ODM 1.3 export</text>
  </g>

  <!-- Engine -->
  <text x="290" y="34" font-size="15" font-weight="700" fill="#323436">2  ENGINE (R package)</text>
  <rect x="290" y="50" width="250" height="210" rx="10" fill="#ffffff" stroke="#323436" stroke-width="2"/>
  <g font-size="14" fill="#323436">
    <text x="306" y="78" font-weight="700">Incremental sync</text>
    <text x="306" y="98" fill="#5f6b76">only changed records</text>
    <text x="306" y="128" font-weight="700">Live dictionary</text>
    <text x="306" y="148" fill="#5f6b76">drift detection, branching</text>
    <text x="306" y="166" fill="#5f6b76">and calculations compiled</text>
    <text x="306" y="196" font-weight="700">Audited ledger</text>
    <text x="306" y="216" fill="#5f6b76">queries, cuts, CDMS state,</text>
    <text x="306" y="234" fill="#5f6b76">script log (SQLite)</text>
  </g>

  <!-- DM and Stats -->
  <text x="610" y="34" font-size="15" font-weight="700" fill="#323436">3  DATA MANAGEMENT</text>
  <g font-size="14">
    <rect x="610" y="50" width="220" height="210" rx="10" fill="#FBEFF0" stroke="#A01621"/>
    <g fill="#323436">
      <text x="626" y="78">Validation rules</text>
      <text x="626" y="102">Queries and audit trail</text>
      <text x="626" y="126">Randomisation</text>
      <text x="626" y="150">Source data verification</text>
      <text x="626" y="174">Locks and e-signatures</text>
      <text x="626" y="198">Medical coding</text>
      <text x="626" y="222">Deviations, site metrics</text>
      <text x="626" y="246">Hashed, signed data cuts</text>
    </g>
  </g>
  <text x="870" y="34" font-size="15" font-weight="700" fill="#323436">4  STATISTICS</text>
  <g font-size="14">
    <rect x="870" y="50" width="210" height="210" rx="10" fill="#EEF3F8" stroke="#2C5D8F"/>
    <g fill="#323436">
      <text x="886" y="78">Wrangle long / wide</text>
      <text x="886" y="102">Table 1 with guarded tests</text>
      <text x="886" y="126">Outliers to queries</text>
      <text x="886" y="150">Trends by arm</text>
      <text x="886" y="174">Linear, logistic, Cox</text>
      <text x="886" y="198">Mixed models</text>
      <text x="886" y="222">Reproducible R script</text>
      <text x="886" y="246">SAP mode</text>
    </g>
  </g>

  <!-- arrows sources -> engine -> dm -> stats -->
  <g stroke="#323436" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220,81 L288,120"/>
    <path d="M220,155 L288,155"/>
    <path d="M220,229 L288,190"/>
    <path d="M540,155 L608,155"/>
    <path d="M830,155 L868,155"/>
  </g>

  <!-- Outputs -->
  <text x="20" y="366" font-size="15" font-weight="700" fill="#323436">5  OUTPUTS AND</text><text x="20" y="386" font-size="15" font-weight="700" fill="#323436">   INTERFACES</text>
  <g font-size="14" fill="#323436">
    <rect x="290" y="336" width="180" height="70" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="304" y="364" font-weight="700">Shiny app</text><text x="304" y="384" fill="#5f6b76">DM + stats workspace</text>
    <rect x="484" y="336" width="180" height="70" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="498" y="364" font-weight="700">Web app + API</text><text x="498" y="384" fill="#5f6b76">roles, live updates</text>
    <rect x="678" y="336" width="180" height="70" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="692" y="364" font-weight="700">Quarto report</text><text x="692" y="384" fill="#5f6b76">from a signed cut</text>
    <rect x="872" y="336" width="208" height="70" rx="8" fill="#F3F4F6" stroke="#DDE1E6"/>
    <text x="886" y="364" font-weight="700">CDISC export</text><text x="886" y="384" fill="#5f6b76">SDTM, define.xml, ODM</text>
  </g>
  <g stroke="#323436" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M415,262 L380,334"/>
    <path d="M720,262 L574,334"/>
    <path d="M975,262 L768,334"/>
    <path d="M990,262 L976,334"/>
  </g>
  </g>
</svg>
