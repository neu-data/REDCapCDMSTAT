# Neudata issue labels — synced automatically by .github/workflows/sync-labels.yml
- name: "type: bug"
  color: "B60205"
  description: "Something in code, pipeline, app or report is not working"
- name: "type: request"
  color: "055F56"
  description: "New analysis, output, feature or enhancement"
- name: "type: data-quality"
  color: "0B376C"
  description: "Missing, inconsistent or implausible data"
- name: "type: docs"
  color: "5FA39B"
  description: "Documentation or training material"
- name: "status: triage"
  color: "04242F"
  description: "Needs review and prioritisation"
- name: "status: in progress"
  color: "6C8DB8"
  description: "Being worked on"
- name: "status: blocked"
  color: "8A99A3"
  description: "Waiting on data, client input or another task"
- name: "priority: high"
  color: "D93F0B"
  description: "Needs attention soon"
