# Neudata · build the pkgdown site and publish it with GitHub Pages
# (Settings → Pages → Source: GitHub Actions)
name: pkgdown

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: REDCapCDMSTAT
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        working-directory: REDCapCDMSTAT
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      # REDCapCDMSTAT compiled for webR, published with the site at /webr/ so
      # the guides can run in the browser. Must match the webR version the
      # site loads (pkgdown/extra.js).
      - name: Build WebAssembly package repository
        uses: r-wasm/actions/build-rwasm@v2
        with:
          packages: local::REDCapCDMSTAT
          repo-path: REDCapCDMSTAT/docs/webr
          image-path: _webr_image
          webr-image: ghcr.io/r-wasm/webr:v0.5.9
          strip: demo, doc, examples, help, html, include, tests, vignette
      - name: Check the WebAssembly repository
        run: |
          sudo chown -R "$(id -u):$(id -g)" REDCapCDMSTAT/docs
          ls -R REDCapCDMSTAT/docs/webr | head -30
          grep -q "Package: REDCapCDMSTAT" REDCapCDMSTAT/docs/webr/bin/emscripten/contrib/*/PACKAGES
      - uses: actions/upload-pages-artifact@v3
        with:
          path: REDCapCDMSTAT/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
