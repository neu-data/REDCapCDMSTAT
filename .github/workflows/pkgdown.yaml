# Neudata · build the pkgdown site and publish it with GitHub Pages
# (Settings → Pages → Source: GitHub Actions)
name: pkgdown

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # REDCapCDMSTAT for webR, so the guides can run in the browser. The package
  # is pure R, so a binary built with the same R version as the webR release
  # the site loads (webR v0.5.9 = R 4.5.1, see pkgdown/extra.js) works there.
  webr-package:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: REDCapCDMSTAT
          dependencies: '"hard"'
      - name: Build the webR package repository
        run: |
          contrib=webr-repo/bin/emscripten/contrib/4.5
          mkdir -p "$contrib"
          R CMD build --no-build-vignettes --no-manual REDCapCDMSTAT
          R CMD INSTALL --build --no-docs --no-html REDCapCDMSTAT_*.tar.gz
          bin=$(ls REDCapCDMSTAT_*_R_*.tar.gz)
          version=$(echo "$bin" | sed -E 's/REDCapCDMSTAT_([^_]+)_R_.*/\1/')
          cp "$bin" "$contrib/REDCapCDMSTAT_${version}.tgz"
          # The webR repository's cardx needs dplyr 1.2.0, which webR does not
          # have yet; cardx 0.3.1 (pure R) works with webR's dplyr 1.1.4.
          Rscript -e 'install.packages(c("cards", "dplyr", "tidyr", "glue", "lifecycle", "rlang", "cli"))'
          curl -sSfLO https://cran.r-project.org/src/contrib/Archive/cardx/cardx_0.3.1.tar.gz
          R CMD INSTALL --build --no-docs --no-html cardx_0.3.1.tar.gz
          cp cardx_0.3.1_R_*.tar.gz "$contrib/cardx_0.3.1.tgz"
          Rscript -e 'tools::write_PACKAGES(commandArgs(TRUE)[1], type = "mac.binary")' "$contrib"
          echo "--- PACKAGES"; cat "$contrib/PACKAGES"
          echo "--- Built field"; tar -xOzf "$contrib/REDCapCDMSTAT_${version}.tgz" REDCapCDMSTAT/DESCRIPTION | grep '^Built:'
          tar -xOzf "$contrib/REDCapCDMSTAT_${version}.tgz" REDCapCDMSTAT/DESCRIPTION | grep -q '^Built: R 4.5.1; ;'
      - uses: actions/upload-artifact@v4
        with:
          name: webr-repo
          path: webr-repo

  build:
    needs: webr-package
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: REDCapCDMSTAT
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build site
        working-directory: REDCapCDMSTAT
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - uses: actions/download-artifact@v4
        with:
          name: webr-repo
          path: REDCapCDMSTAT/docs/webr
      - name: Check the webR repository is in the site
        run: |
          grep -q "Package: REDCapCDMSTAT" REDCapCDMSTAT/docs/webr/bin/emscripten/contrib/4.5/PACKAGES
      - uses: actions/upload-pages-artifact@v3
        with:
          path: REDCapCDMSTAT/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
